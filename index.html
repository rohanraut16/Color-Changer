<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Changer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Color Changer</h1>
        <div class="inputBtnContainer">
            <button class="randomBtn">Random Color</button>
            <input type="text" id="inputColor" placeholder="Enter a color or (e.g. white or #fff)">
            <button class="applyBtn">Apply Color</button>
        </div>
        <p>Current color value : <span class="currentColorValue">rgb(71, 75, 75)</span></p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
